<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #fff; --ink: #1c1f23; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-ink: #fff; --ok: #16a34a; --warn: #dc2626; --chip: #eef2ff;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1e2126; --ink: #e6e8eb; --muted: #9aa0a6; --line: #2c3036;
      --accent: #6ba3ff; --accent-ink: #0b1220; --chip: #232a3a;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 20px 0; }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  nav { display: flex; gap: 4px; max-width: 1040px; margin: 10px auto 0; overflow-x: auto; }
  nav button { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer;
    padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1040px; margin: 0 auto; padding: 18px 20px 60px; }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: none; letter-spacing: .2px; color: var(--muted);
    margin: 0 0 12px; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  li:last-child { border-bottom: 0; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 92px; flex: none; }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title.done { text-decoration: line-through; color: var(--muted); }
  .chip { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .chip.cat { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  button.ghost, button.primary { font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid transparent; font-weight: 600; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.mini { padding: 2px 8px; font-size: 12px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; }
  form .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  form .row > * { flex: 1 1 120px; }
  form .row > .tight { flex: 0 0 96px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .goal { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .goal .name { font-weight: 600; }
  .track { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 8px 0 6px; }
  .fill { height: 100%; background: var(--accent); }
  .fill.over { background: var(--warn); }
  .metric { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric b { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .metric span { color: var(--muted); font-size: 12px; }
  .bars { display: grid; gap: 6px; }
  .brow { display: grid; grid-template-columns: 52px 1fr 64px; gap: 10px; align-items: center; font-size: 12px; }
  .btrack { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .btrack i { display: block; height: 100%; background: var(--accent); }
  .note { border-left: 2px solid var(--accent); padding: 2px 0 2px 10px; margin: 8px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; padding: 6px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .empty { color: var(--muted); padding: 10px 0; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .18s; max-width: 80vw; z-index: 50; }
  .toast.show { opacity: .95; transform: translateX(-50%); }
  .hit { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .hit .src { color: var(--muted); font-size: 11px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>工作台</h1>
    <span class="muted small" id="todayLabel"></span>
    <span class="grow"></span>
    <button class="ghost mini" id="refresh" title="重新读取数据">刷新</button>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">今日</button>
    <button role="tab" data-tab="goals" aria-selected="false">目标</button>
    <button role="tab" data-tab="notes" aria-selected="false">记录</button>
    <button role="tab" data-tab="search" aria-selected="false">检索</button>
    <button role="tab" data-tab="stats" aria-selected="false">统计</button>
  </nav>
</header>
<main>
  <!-- 今日 -->
  <section id="pane-today">
    <div class="cols">
      <div class="card">
        <h2>今日日程</h2>
        <ul id="todayList"></ul>
        <div id="todayEmpty" class="empty">今天还没有安排。</div>
      </div>
      <div class="card">
        <h2>快速记录</h2>
        <form id="eventForm">
          <div class="row"><input name="title" placeholder="做什么" required></div>
          <div class="row">
            <input name="start" class="tight" placeholder="开始 09:00" inputmode="numeric">
            <input name="end" class="tight" placeholder="结束 10:30" inputmode="numeric">
            <select name="category">
              <option value="work">工作</option><option value="study">学习</option>
              <option value="health">健康</option><option value="life">生活</option>
              <option value="rest">休息</option><option value="other">其他</option>
            </select>
          </div>
          <div class="row"><input name="tags" placeholder="标签，逗号分隔"></div>
          <div class="row"><button class="primary" type="submit">加入今日</button></div>
        </form>
      </div>
    </div>
    <div class="card">
      <h2>进行中的目标</h2>
      <div class="grid2" id="todayGoals"></div>
    </div>
  </section>

  <!-- 目标 -->
  <section id="pane-goals" hidden>
    <div class="card">
      <h2>新建目标</h2>
      <form id="goalForm">
        <div class="row"><input name="title" placeholder="目标名称" required></div>
        <div class="row">
          <select name="horizon"><option value="quarter">季度</option><option value="year">年度</option><option value="month">月度</option></select>
          <input name="target" placeholder="目标值，如 500" inputmode="numeric">
          <input name="unit" placeholder="单位，如 km" class="tight">
          <input name="due" placeholder="截止 2026-12-31" class="tight">
        </div>
        <div class="row"><input name="why" placeholder="为什么做（一句话）"></div>
        <div class="row"><button class="primary" type="submit">创建</button></div>
      </form>
    </div>
    <div class="grid2" id="goalGrid"></div>
  </section>

  <!-- 记录 -->
  <section id="pane-notes" hidden>
    <div class="card">
      <h2>记一条</h2>
      <form id="noteForm">
        <div class="row">
          <select name="kind">
            <option value="note">记录</option><option value="idea">想法</option>
            <option value="link">链接</option><option value="quote">引用</option>
          </select>
          <input name="tags" placeholder="标签，逗号分隔">
        </div>
        <div class="row"><textarea name="text" rows="3" placeholder="写点什么…" required></textarea></div>
        <div class="row"><button class="primary" type="submit">保存</button></div>
      </form>
    </div>
    <div class="card">
      <h2>最近记录</h2>
      <div id="noteList"></div>
    </div>
  </section>

  <!-- 检索 -->
  <section id="pane-search" hidden>
    <div class="card">
      <h2>检索全部数据（日程 / 记录 / 目标）</h2>
      <form id="searchForm"><div class="row"><input name="q" placeholder="输入关键词，回车检索" autocomplete="off"></div></form>
      <div id="searchResults"></div>
    </div>
  </section>

  <!-- 统计 -->
  <section id="pane-stats" hidden>
    <div class="card">
      <div class="seg" id="statsSeg">
        <button data-range="week" aria-pressed="true">本周</button>
        <button data-range="month" aria-pressed="false">本月</button>
        <button data-range="year" aria-pressed="false">今年</button>
      </div>
      <div class="metric" id="statsMetric"></div>
      <div class="bars" id="statsCats"></div>
    </div>
    <div class="card">
      <h2>每日分布</h2>
      <div class="bars" id="statsDays"></div>
    </div>
    <div class="card">
      <h2>标签投入</h2>
      <div id="statsTags" class="muted small"></div>
      <div class="row" style="margin-top:14px"><button class="ghost" id="reviewBtn">生成本期复盘 Markdown</button></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const CAT_CN = { work: '工作', study: '学习', health: '健康', life: '生活', rest: '休息', other: '其他' };
let STATE = null;
let RANGE = 'week';
let TAB = 'today';

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(path, options) {
  const res = await fetch('/workbench/api' + path, options);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw new Error((data && data.message) || text || res.statusText);
  return data;
}

async function load() {
  try {
    STATE = await api('/state');
  } catch (err) {
    toast('读取失败：' + err.message);
    return;
  }
  $('#todayLabel').textContent = STATE.today.date + ' 周' + STATE.today.weekday;
  renderToday();
  renderGoals();
  renderNotes();
  renderStats();
}

function fmtH(h) { return (Math.round(h * 10) / 10).toFixed(1) + 'h'; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- 今日 ---------- */
function renderToday() {
  const t = STATE.today;
  const list = $('#todayList');
  list.innerHTML = t.events.map((e) => `
    <li>
      <span class="time">${e.start ? esc(e.start) + '–' + esc(e.end || '') : '待定'}</span>
      <span class="title ${e.status === 'done' ? 'done' : ''}">${esc(e.title)}</span>
      <span class="chip cat">${CAT_CN[e.category] || e.category}</span>
      ${e.tags.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}
      ${e.status === 'done'
        ? '<span class="chip">已完成</span>'
        : `<button class="ghost mini" data-done="${esc(e.id)}">完成</button>`}
    </li>`).join('');
  $('#todayEmpty').hidden = t.events.length > 0;

  const goals = t.goals;
  $('#todayGoals').innerHTML = goals.length ? goals.map(goalCard).join('') : '<div class="empty">没有进行中的目标。</div>';
}

function goalCard(g) {
  const pct = g.pct === null ? null : Math.min(100, g.pct);
  return `<div class="goal">
    <div class="name">${esc(g.title)}</div>
    <div class="muted small">${g.progress}/${g.target ?? '?'}${esc(g.unit)}${g.due ? ' · 截止 ' + esc(g.due) : ''}${g.overdue ? ' · <b style="color:var(--warn)">逾期</b>' : ''}</div>
    ${pct === null ? '' : `<div class="track"><div class="fill ${pct >= 100 ? 'over' : ''}" style="width:${pct}%"></div></div>`}
    <div class="row" style="margin-top:10px;display:flex;gap:6px">
      <button class="ghost mini" data-progress="${esc(g.id)}" data-add="1">+1</button>
      <button class="ghost mini" data-progress="${esc(g.id)}" data-add="5">+5</button>
      <button class="ghost mini" data-progress="${esc(g.id)}" data-set="0">清零</button>
    </div>
  </div>`;
}

/* ---------- 目标 ---------- */
function renderGoals() {
  const goals = STATE.goals || [];
  $('#goalGrid').innerHTML = goals.length
    ? goals.map((g) => {
        const pct = g.target ? Math.min(100, Math.round(((g.progress || 0) / g.target) * 100)) : null;
        return `<div class="goal">
          <div class="name">${esc(g.title)} ${g.status === 'done' ? '<span class="chip">达成</span>' : ''}</div>
          <div class="muted small">${esc(g.horizon || '')} · ${g.progress || 0}/${g.target ?? '?'}${esc(g.unit || '')}${g.due ? ' · 截止 ' + esc(g.due) : ''}</div>
          ${pct === null ? '' : `<div class="track"><div class="fill" style="width:${pct}%"></div></div>`}
          ${g.why ? `<div class="muted small">${esc(g.why)}</div>` : ''}
          <div style="margin-top:10px;display:flex;gap:6px">
            <button class="ghost mini" data-progress="${esc(g.id)}" data-add="1">+1</button>
            <button class="ghost mini" data-progress="${esc(g.id)}" data-add="5">+5</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">还没有目标。</div>';
}

/* ---------- 记录 ---------- */
function renderNotes() {
  const notes = STATE.notes || [];
  $('#noteList').innerHTML = notes.length
    ? notes.map((n) => `<div class="note">
        <div class="small muted">${esc((n.ts || '').replace('T', ' ').slice(0, 16))} · ${esc(n.kind || 'note')}${(n.tags || []).length ? ' · ' + n.tags.map(esc).join(' ') : ''}</div>
        <div>${esc(n.text)}</div>
      </div>`).join('')
    : '<div class="empty">还没有记录。</div>';
}

/* ---------- 统计 ---------- */
function renderStats() {
  const s = STATE[RANGE];
  if (!s) return;
  const activeDays = Object.keys(s.byDay || {}).length;
  $('#statsMetric').innerHTML = `
    <div><b>${fmtH(s.total || 0)}</b><span>总投入</span></div>
    <div><b>${s.count || 0}</b><span>日程数</span></div>
    <div><b>${s.count ? Math.round(((s.done || 0) / s.count) * 100) : 0}%</b><span>完成率</span></div>
    <div><b>${activeDays}</b><span>活跃天数</span></div>
    <div><b>${activeDays ? fmtH((s.total || 0) / activeDays) : '0h'}</b><span>日均</span></div>`;

  const cats = s.byCat || [];
  const max = cats.length ? cats[0][1] : 0;
  $('#statsCats').innerHTML = cats.length
    ? cats.map(([c, h]) => `<div class="brow"><span>${CAT_CN[c] || esc(c)}</span>
        <span class="btrack"><i style="width:${max ? (h / max) * 100 : 0}%"></i></span>
        <span class="muted" style="text-align:right">${fmtH(h)}</span></div>`).join('')
    : '<div class="empty">本期没有日程。</div>';

  const days = Object.entries(s.byDay || {}).sort((a, b) => a[0].localeCompare(b[0]));
  const dmax = days.reduce((m, [, h]) => Math.max(m, h), 0);
  $('#statsDays').innerHTML = days.length
    ? days.map(([d, h]) => `<div class="brow"><span>${esc(d.slice(5))}</span>
        <span class="btrack"><i style="width:${dmax ? (h / dmax) * 100 : 0}%"></i></span>
        <span class="muted" style="text-align:right">${fmtH(h)}</span></div>`).join('')
    : '<div class="empty">本期没有记录。</div>';

  $('#statsTags').innerHTML = (s.byTag || []).length
    ? '标签投入：' + s.byTag.map(([t, h]) => `<span class="chip">${esc(t)} ${fmtH(h)}</span>`).join(' ')
    : '暂无标签数据。';
}

/* ---------- 交互 ---------- */
$('#tabs').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-tab]');
  if (!btn) return;
  TAB = btn.dataset.tab;
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b === btn));
  for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== 'pane-' + TAB;
});

$('#statsSeg').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-range]');
  if (!btn) return;
  RANGE = btn.dataset.range;
  for (const b of document.querySelectorAll('#statsSeg button')) b.setAttribute('aria-pressed', String(b === btn));
  renderStats();
});

document.addEventListener('click', async (ev) => {
  const done = ev.target.closest('[data-done]');
  if (done) {
    try { toast((await api('/done', post({ id: done.dataset.done }))).message); await load(); }
    catch (err) { toast('失败：' + err.message); }
    return;
  }
  const prog = ev.target.closest('[data-progress]');
  if (prog) {
    const body = { id: prog.dataset.progress };
    if (prog.dataset.add) body.add = prog.dataset.add;
    if (prog.dataset.set !== undefined) body.set = prog.dataset.set;
    try { toast((await api('/progress', post(body))).message); await load(); }
    catch (err) { toast('失败：' + err.message); }
  }
});

function post(body) {
  return { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
}

$('#eventForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const body = { title: f.get('title'), start: f.get('start'), end: f.get('end'), category: f.get('category'), tags: f.get('tags') };
  try {
    toast((await api('/event', post(body))).message);
    ev.target.reset();
    await load();
  } catch (err) { toast('失败：' + err.message); }
});

$('#goalForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const body = Object.fromEntries(['title', 'horizon', 'target', 'unit', 'due', 'why'].map((k) => [k, f.get(k)]));
  try {
    toast((await api('/goal', post(body))).message);
    ev.target.reset();
    await load();
  } catch (err) { toast('失败：' + err.message); }
});

$('#noteForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    toast((await api('/note', post({ text: f.get('text'), kind: f.get('kind'), tags: f.get('tags') }))).message);
    ev.target.reset();
    await load();
  } catch (err) { toast('失败：' + err.message); }
});

$('#searchForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = new FormData(ev.target).get('q').trim();
  if (!q) return;
  const box = $('#searchResults');
  box.innerHTML = '<div class="empty">检索中…</div>';
  try {
    const hits = await api('/search?q=' + encodeURIComponent(q));
    box.innerHTML = hits.length
      ? `<div class="muted small">${hits.length} 条命中</div>` + hits.map((h) => `<div class="hit">
          <div class="src">${esc(h.at)}</div><div>${esc(h.text)}</div></div>`).join('')
      : '<div class="empty">没有命中。</div>';
  } catch (err) { box.innerHTML = `<div class="empty">失败：${esc(err.message)}</div>`; }
});

$('#reviewBtn').addEventListener('click', async () => {
  try { toast((await api('/review', post({ kind: RANGE }))).message); }
  catch (err) { toast('失败：' + err.message); }
});

$('#refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
